##############################################
#                                            #
#           Superfile Configuration          #
#                                            #
##############################################

# This contains the hotkey config file for t4gfm! More details can be found at
# https://t4gfm.dev/configure/custom-hotkeys/.

###############################################################################
#                                Global hotkeys                               #
###############################################################################

# Note: These hotkeys should be unique.

#-- Basic Actions
confirm = ['enter', 'right', 'l']
cd_quit = ['Q', '']
quit = ['q', '']

#-- Navigation
list_down = ['down', 'j']
list_up = ['up', 'k']
page_down = ['ctrl+f', 'pgdown']
page_up = ['ctrl+b', 'pgup']

#-- File Panel Controls
close_file_panel = ['w', '']
create_new_file_panel = ['n', '']
next_file_panel = ['tab', '']
open_sort_options_menu = ['O', '']
pinned_directory = ['P', '']
previous_file_panel = ['shift+left', 'H']
toggle_file_preview_panel = ['f', '']
toggle_reverse_sort = ['ctrl+r', '']

#-- Focus Manipulation
focus_on_metadata = ['', '']
focus_on_process_bar = ['', '']
focus_on_sidebar = ['', '']
focus_on_git = ['', '']
jump_to_pinned = ['', '']
jump_to_disks = ['', '']
move_pinned_item_up = ['K', 'shift+k']
move_pinned_item_down = ['J', 'shift+j']

#-- File/Dir Creation/Renaming
file_panel_item_create = ['a', '']
file_panel_item_rename = ['r', '']

#-- Main File Operations
copy_items = ['y', '']
cut_items = ['x', '']
delete_items = ['delete', '']
paste_items = ['', '']
permanently_delete_items = ['D', '']

#-- Archive Manipulation
compress_file = ['', '']
extract_file = ['', '']

#-- Editor Actions
open_current_directory_with_editor = ['E', '']
open_file_with_editor = ['R', 'e']

#-- Other Actions
change_panel_mode = ['space', 'v']
copy_path = ['Y', '']
copy_present_working_directory = ['', '']
open_command_line = [':', '']
open_help_menu = ['?', '']
open_t4gfm_prompt = ['>', '']
open_zoxide = ['Z', '']
toggle_dot_file = ['.', '']
toggle_sidebar = ['b', '']
toggle_footer = ['F', '']

###############################################################################
#                                Typing hotkeys                               #
###############################################################################

# Note: These hotkeys can override all hotkeys.

confirm_typing = ['enter', '']
cancel_typing = ['ctrl+c', 'esc']

###############################################################################
#                            Mode-Specific Hotkeys                            #
###############################################################################

# Note: These hotkeys can conflict with other modes, but not with global
# hotkeys.

#-- Normal Mode Actions
parent_directory = ['h', 'left', 'backspace']
search_bar = ['/', '']

#-- Selection Mode Actions
file_panel_select_mode_items_select_down = ['shift+down', 'J']
file_panel_select_mode_items_select_up = ['shift+up', 'K']
file_panel_select_all_items = ['A', '']
